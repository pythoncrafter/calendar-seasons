name: Upload to TestFlight
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'New positive build number (must be higher than previous uploads)'
        required: true
        type: string
      signing_run_id:
        description: Previous run containing an encrypted signing identity (optional)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    environment: testflight
    timeout-minutes: 35
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build && npm test
      - run: bash scripts/select-xcode.sh
      - name: Check release configuration
        run: python3 scripts/configure-release.py --check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: ruby -c fastlane/Fastfile
      - name: Reuse encrypted signing identity from a previous run
        if: inputs.signing_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: encrypted-signing-identity
          path: ${{ runner.temp }}/calendar-seasons-signing-import
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signing_run_id }}
      - name: Compile, sign, and upload
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_FILE: ${{ runner.temp }}/calendar-seasons-signing-import/SigningCertificate.p12
        run: bundle exec fastlane ios beta
      - name: Retain encrypted signing identity for reuse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-identity
          path: ${{ runner.temp }}/calendar-seasons-signing-recovery/
          if-no-files-found: ignore
          retention-days: 1
