<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar Seasons</title><link rel="stylesheet" href="popup.css"></head><body><main>
<header><img src="assets/logo.svg" alt=""><div><p class="eyebrow">A LITTLE EVERYDAY MAGIC</p><h1>Calendar Seasons</h1></div></header>
<p class="intro">Make room for a little joy.</p><div id="themes" class="themes" role="group" aria-label="Seasonal theme"></div>
<section class="panel"><label class="switch"><span>Follow the seasons<small>Changes with your local month</small></span><input id="automatic" type="checkbox"></label><label>Decoration mood<select id="level"><option value="minimal">Minimal · a quiet touch</option><option value="cozy">Cozy · just enough wonder</option><option value="magical">Magical · let it float</option></select></label>
<div class="colors"><label>Background<input id="background" type="color"></label><label>Accent<input id="accent" type="color"></label><label>Surface<input id="surface" type="color"></label></div><button id="palette" class="text-button">Use seasonal colors</button>
<label class="switch"><span>Floating animations</span><input id="animation" type="checkbox"></label><label class="switch"><span>Seasonal corner icon</span><input id="icons" type="checkbox"></label><label class="switch"><span>Extra gentle motion<small>Device motion preferences always apply</small></span><input id="reducedMotion" type="checkbox"></label><label class="switch"><span>Winter holiday details</span><input id="holiday" type="checkbox"></label>
<details><summary>Seasonal calendar</summary><p>Choose a season for each month.</p><div id="months"></div></details></section>
<div class="footer-actions"><button id="restore">Default Google appearance</button><button id="enable">Bring back the seasons</button></div><p id="status" role="status" aria-live="polite"></p><footer>Private by nature. Saved only on this device.<br>Styles Google Calendar on the web, not the iOS app.</footer></main><script src="engine.js"></script><script src="storage.js"></script><script src="popup.js"></script></body></html>
